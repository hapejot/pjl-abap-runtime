[package]
name = "abap-rt"
version = "0.1.0"
edition = "2021"

[lib]
name = "abap_rt"
crate-type = ["staticlib", "rlib"]

[dependencies]
crossterm = "0.29.0"
abap-sql-ir = { path = "../abap-sql-ir" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
